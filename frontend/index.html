<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAEquip Product Hub</title>
    <!--
      The SA EQUIP logo mark. Declared as the ONLY rel="icon" on purpose: a
      browser picks the best candidate from everything declared, so leaving the
      old favicon.svg alongside this would keep winning (scalable beats a
      raster at every size) and the icon would appear not to have changed.

      The superseded files (favicon.svg/.ico/-16x16/-32x32, apple-touch-icon)
      are still in public/ but unreferenced. Only a legacy client probing
      /favicon.ico by convention can still reach the old mark.
    -->
    <link rel="icon" type="image/jpeg" href="/sa-favicon.jpg" />
    <link rel="apple-touch-icon" href="/sa-favicon.jpg" />

    <!-- Barlow (headings), Inter (body) and JetBrains Mono (codes, SKUs,
         counts) — the dashboard's only typefaces, from Google Fonts.
         Barlow 400 and Inter 700 are not used by the dashboard itself; they
         are here for the /widgets previews, whose copied widget CSS uses them.
         A weight's font file only downloads when text actually uses it, so
         they cost nothing on the other pages. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

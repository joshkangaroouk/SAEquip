<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAEquip Product Hub</title>
    <!--
      The SA EQUIP logo mark. Declared as the ONLY rel="icon" on purpose: a
      browser picks the best candidate from everything declared, so leaving the
      old favicon.svg alongside this would keep winning (scalable beats a
      raster at every size) and the icon would appear not to have changed.

      The superseded files (favicon.svg/.ico/-16x16/-32x32, apple-touch-icon)
      are still in public/ but unreferenced. Only a legacy client probing
      /favicon.ico by convention can still reach the old mark.
    -->
    <link rel="icon" type="image/jpeg" href="/sa-favicon.jpg" />
    <link rel="apple-touch-icon" href="/sa-favicon.jpg" />

    <!-- DIN 2014 via Adobe Fonts. Adobe's licence forbids self-hosting the
         files, so this must load from their CDN rather than being vendored
         into public/fonts the way the previous typefaces were. The dashboard's
         domain has to be listed in the Adobe Fonts web project, or the CSS
         serves nothing and the app silently falls back to system sans. -->
    <link rel="preconnect" href="https://use.typekit.net" crossorigin />
    <link rel="stylesheet" href="https://use.typekit.net/mrd2ybk.css" />

    <!-- Barlow + Inter are for the WIDGET PREVIEWS on /widgets only, never for
         the dashboard's own UI (that is DIN 2014, above). The public widget
         renders headings in Barlow and body text in Inter 16, and those
         previews are documented as byte-accurate reproductions of it — without
         these they would silently fall back to DIN 2014 and stop matching what
         Duda actually shows, which is the one thing the previews exist for.
         The live Duda site loads both families itself; this is the dashboard
         catching up, not a new dependency for the widget. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
